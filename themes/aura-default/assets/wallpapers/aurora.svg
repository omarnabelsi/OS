<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- aura-default / aurora: static fallback wallpaper. Pure vector - gradients and blurred ellipses. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#07080c"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".55"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="softer" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="140"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#ground)"/>

  <!-- distant haze -->
  <g filter="url(#softer)">
    <ellipse cx="960" cy="220" rx="900" ry="200" fill="#6ee7ff" opacity=".10"/>
    <ellipse cx="1500" cy="920" rx="520" ry="220" fill="#7c6cff" opacity=".08"/>
    <ellipse cx="300" cy="880" rx="480" ry="180" fill="#34d3b8" opacity=".06"/>
  </g>

  <!-- aurora bands -->
  <g filter="url(#soft)">
    <ellipse cx="560" cy="360" rx="720" ry="110" fill="#6ee7ff" opacity=".26" transform="rotate(-9 560 360)"/>
    <ellipse cx="1180" cy="300" rx="640" ry="90" fill="#34d3b8" opacity=".20" transform="rotate(-6 1180 300)"/>
    <ellipse cx="1420" cy="480" rx="560" ry="100" fill="#7c6cff" opacity=".20" transform="rotate(-12 1420 480)"/>
    <ellipse cx="300" cy="560" rx="520" ry="80" fill="#4fb3ff" opacity=".16" transform="rotate(-4 300 560)"/>
    <ellipse cx="900" cy="440" rx="380" ry="50" fill="#b8f3ff" opacity=".12" transform="rotate(-8 900 440)"/>
  </g>

  <!-- sparse stars -->
  <g fill="#f4f6fb">
    <circle cx="112" cy="94" r="1.4" opacity=".55"/>
    <circle cx="238" cy="212" r="1" opacity=".4"/>
    <circle cx="341" cy="61" r="1.2" opacity=".5"/>
    <circle cx="455" cy="168" r=".9" opacity=".35"/>
    <circle cx="512" cy="288" r="1.3" opacity=".45"/>
    <circle cx="640" cy="120" r="1" opacity=".5"/>
    <circle cx="733" cy="46" r="1.5" opacity=".6"/>
    <circle cx="812" cy="230" r=".9" opacity=".35"/>
    <circle cx="905" cy="98" r="1.1" opacity=".45"/>
    <circle cx="1024" cy="172" r="1.4" opacity=".55"/>
    <circle cx="1130" cy="58" r="1" opacity=".4"/>
    <circle cx="1216" cy="196" r="1.2" opacity=".5"/>
    <circle cx="1338" cy="82" r=".9" opacity=".35"/>
    <circle cx="1402" cy="240" r="1.3" opacity=".45"/>
    <circle cx="1490" cy="134" r="1" opacity=".5"/>
    <circle cx="1588" cy="52" r="1.5" opacity=".6"/>
    <circle cx="1666" cy="208" r=".9" opacity=".35"/>
    <circle cx="1752" cy="112" r="1.1" opacity=".45"/>
    <circle cx="1838" cy="176" r="1.4" opacity=".55"/>
    <circle cx="176" cy="402" r="1" opacity=".3"/>
    <circle cx="388" cy="486" r="1.2" opacity=".35"/>
    <circle cx="700" cy="612" r=".9" opacity=".3"/>
    <circle cx="960" cy="540" r="1.1" opacity=".3"/>
    <circle cx="1246" cy="640" r="1.3" opacity=".35"/>
    <circle cx="1560" cy="596" r="1" opacity=".3"/>
    <circle cx="1810" cy="700" r="1.2" opacity=".35"/>
    <circle cx="96" cy="760" r="1" opacity=".25"/>
    <circle cx="520" cy="820" r="1.2" opacity=".25"/>
    <circle cx="1080" cy="880" r=".9" opacity=".25"/>
    <circle cx="1400" cy="1010" r="1.1" opacity=".25"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
